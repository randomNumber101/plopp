name: Katalog

# Lädt Brauereien und Biere (Wikipedia, Wikidata, OpenStreetMap, Open Brewery DB, Brauerei-Websites, Open Food Facts)
# in die Datenbank. Fortschritt: im Log („▶ [3/9] …“) und live in der App unter Mehr → Katalog.
# Läuft monatlich, bei Änderungen am Scraper und auf Knopfdruck (Actions → Katalog → Run workflow).
on:
  push:
    branches: [main]
    paths: ['scraper/**', '.github/workflows/catalog.yml']
  schedule:
    - cron: '23 4 2 * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read      # kostenlose KI (GitHub Models) für Websites, die die Regeln nicht verstehen

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Offline-Tests
        run: python -m scraper.tests.test_offline
      - name: Datenbank-Verbindung
        run: bash scripts/db-url.sh
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Migrationen einspielen
        run: bash scripts/migrate.sh
      - name: Katalog laden
        run: python -m scraper.main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_GITHUB_MODELS: '1'
          PYTHONUNBUFFERED: '1'
          SITE_BUDGET_S: '2700'
      - name: Bericht speichern
        if: always()
        run: |
          [ -d catalog ] || exit 0
          git config user.name "katalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog
          git diff --cached --quiet && exit 0
          git commit -m "Katalog: Bericht $(date -u +%F)"
          git pull --rebase origin main
          git push
